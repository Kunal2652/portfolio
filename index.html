<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description"
    content="Kunal's developer portfolio showcasing full-stack projects, technical skills, and research." />

  <meta name="theme-color" content="#0b0d0f" />

  <!-- Website favicon -->
  <link rel="icon" type="image/svg+xml" href="/kunal.png" />

  <title>Kunal | Full-Stack Developer</title>

  <script>
    (function (location) {
      if (location.search[1] === "/") {
        const decoded = location.search
          .slice(1)
          .split("&")
          .map((part) => part.replace(/~and~/g, "&"))
          .join("?");

        window.history.replaceState(
          null,
          null,
          location.pathname.replace(/\/$/, "") + decoded + location.hash
        );
      }
    })(window.location);
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
